[project]
name = "sketchup-mcp"
version = "0.1.17"
description = "Sketchup integration through Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
lint = [
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples", "su_mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[project.urls]
Homepage = "https://github.com/lumberbarons/sketchup-mcp"
Issues = "https://github.com/lumberbarons/sketchup-mcp/issues"

[project.scripts]
sketchup-mcp = "sketchup_mcp.server:main"

[project.entry-points.mcp]
sketchup = "sketchup_mcp.server:mcp"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"} 