version: 2

project_name: sketchup-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: sketchup-mcp
    main: ./cmd/sketchup-mcp
    binary: sketchup-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 isn't a target right now — keep the release matrix tight.
      - goos: windows
        goarch: arm64

archives:
  - id: sketchup-mcp
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  header: |
    ## sketchup-mcp {{ .Tag }}

    Prebuilt MCP server binary that bridges Claude (and other MCP clients) to the
    SketchUp Ruby extension. Pair with the matching `su_mcp_v{{ .Version }}.rbz`.
  extra_files:
    - glob: ./su_mcp_v*.rbz
